<!-- escola_form.html -->
{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            {% if form.instance.pk %}
            <h3>Editar Escola</h3>
            {% else %}
            <h3>Nova Escola</h3>
            {% endif %}
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                
                <div class="form-group mb-3">
                    <label for="id_nome">Nome da Escola</label>
                    {{ form.nome }}
                </div>
                
                <div class="form-group mb-3">
                    <label for="id_codigo">Código</label>
                    {{ form.codigo }}
                </div>
                
                <div class="form-group">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="{% url 'superadmin_dashboard' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
