{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Excluir Coordenador</h2> 
    <p>Tem certeza que deseja excluir o coordenador <strong>{{ coordenador.user.nome_completo }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Confirmar Exclusão</button>
        <a href="{% url 'escola_dashboard' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
