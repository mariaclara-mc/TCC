{% extends 'diverge/base.html' %}

{% block content %}
<div class="container py-5">
    <div class="progress mb-4">
        <div class="progress-bar" role="progressbar" data-progress="{{progresso}}" aria-valuenow="{{progresso}}" aria-valuemin="0" aria-valuemax="100">
             aria-valuenow="{{ progresso }}" aria-valuemin="0" aria-valuemax="100">
            {{ progresso }}%
        </div>
    </div>
    
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="my-0">Pergunta {{ pergunta_atual }} de {{ total_perguntas }}</h4>
        </div>
        <div class="card-body">
            <h5 class="card-title mb-4">{{ pergunta.texto }}</h5>
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-4">
                    <div class="d-flex justify-content-between mb-2">
                        <span>Nunca</span>
                        <span>Sempre</span>
                    </div>
                    
                    <div class="btn-group w-100" role="group">
                        <input type="radio" class="btn-check" name="resposta" id="resp0" value="0" required>
                        <label class="btn btn-outline-primary" for="resp0">0</label>
                        
                        <input type="radio" class="btn-check" name="resposta" id="resp1" value="1">
                        <label class="btn btn-outline-primary" for="resp1">1</label>
                        
                        <input type="radio" class="btn-check" name="resposta" id="resp2" value="2">
                        <label class="btn btn-outline-primary" for="resp2">2</label>
                        
                        <input type="radio" class="btn-check" name="resposta" id="resp3" value="3">
                        <label class="btn btn-outline-primary" for="resp3">3</label>
                        
                        <input type="radio" class="btn-check" name="resposta" id="resp4" value="4">
                        <label class="btn btn-outline-primary" for="resp4">4</label>
                    </div>
                </div>
                
                <div class="text-center">
                    <button type="submit" class="btn btn-primary">Próxima</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
